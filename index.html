<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Настройка viewport для корректного отображения на iPhone -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMT & Balance Diagnostics</title>
    <!-- Подключаем Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            margin: 0; 
            padding: 15px; 
            background-color: #f4f4f9; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        h2 { text-align: center; font-size: 1.2rem; margin: 10px 0; }
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #balanceCanvas {
            max-width: 100%;
            background: #fafafa;
            border-radius: 50%;
            border: 2px solid #ddd;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:active { background-color: #005bb5; }
        #status { text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="connectBtn">Подключить сенсор</button>
    <div id="status">Отключено</div>

    <!-- Блок стабилометрии (Баланс) -->
    <div class="card">
        <h2>Баланс (Паттерн падения)</h2>
        <canvas id="balanceCanvas" width="250" height="250"></canvas>
    </div>

    <!-- Блок ММТ (График силы) -->
    <div class="card" style="flex: 1.2;">
        <h2>График силы ММТ (FSR)</h2>
        <div class="canvas-container">
            <canvas id="fsrChart"></canvas>
        </div>
    </div>

    <script>
        // --- Настройки BLE ---
        const BLE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const BLE_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let bleDevice, bleServer, bleService, txCharacteristic;
        let dataBuffer = "";

        // --- Инициализация графики (Баланс) ---
        const canvas = document.getElementById('balanceCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        function drawBalance(pitch, roll) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка мишени
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for(let r = 30; r <= 120; r += 30) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.stroke();
            }
            // Осевые линии
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();

            // Вычисление позиции маркера
            // Roll (влево/вправо) -> X, Pitch (вперед/назад) -> Y
            // Множитель "3" задает чувствительность графика (градусы -> пиксели)
            let markerX = cx + (roll * 3);
            let markerY = cy - (pitch * 3); // минус, так как Y в canvas растет вниз

            // Ограничение выхода за границы
            markerX = Math.max(10, Math.min(canvas.width - 10, markerX));
            markerY = Math.max(10, Math.min(canvas.height - 10, markerY));

            // Отрисовка маркера вектора
            ctx.beginPath();
            ctx.arc(markerX, markerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = '#ff3b30';
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        drawBalance(0, 0); // Начальная отрисовка

        // --- Инициализация графики (ММТ FSR) ---
        const ctxChart = document.getElementById('fsrChart').getContext('2d');
        const fsrChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: Array(50).fill(''), // Окно на 50 точек
                datasets: [{
                    label: 'Сила давления',
                    data: Array(50).fill(0),
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, // Убираем точки для вида кардиограммы
                    fill: true,
                    tension: 0.2 // Легкое сглаживание
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, // Отключаем анимацию для высокой производительности реального времени
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, suggestedMax: 1000 } // Подстройте max под диапазон вашего АЦП (например 4095 для ESP32/nRF)
                },
                plugins: { legend: { display: false } }
            }
        });

        function updateFSR(fsrValue) {
            fsrChart.data.datasets[0].data.push(fsrValue);
            fsrChart.data.datasets[0].data.shift(); // Удаляем старую точку
            fsrChart.update('none'); // Обновление без анимации
        }

        // --- Логика Web Bluetooth API ---
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Поиск устройства...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = "Устройство отключено";
                });

                document.getElementById('status').innerText = "Подключение к GATT...";
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
                txCharacteristic = await bleService.getCharacteristic(BLE_TX_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                
                document.getElementById('status').innerText = "Сенсор подключен. Ожидание данных...";
                document.getElementById('status').style.color = "#34c759";
                document.getElementById('connectBtn').style.display = "none";
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Ошибка: " + error.message;
            }
        });

        function handleData(event) {
            // Чтение байтов и конвертация в строку
            const decoder = new TextDecoder('utf-8');
            const chunk = decoder.decode(event.target.value);
            dataBuffer += chunk;

            // Парсинг полных строк, заканчивающихся на \n
            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); // Последний (неполный) кусок оставляем в буфере

            lines.forEach(line => {
                line = line.trim();
                if(line) {
                    let [fsr, pitch, roll] = line.split(',').map(Number);
                    
                    if(!isNaN(fsr) && !isNaN(pitch) && !isNaN(roll)) {
                        updateFSR(fsr);
                        drawBalance(pitch, roll);
                    }
                }
            });
        }
    </script>
</body>
</html>
