<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMT & Balance Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            margin: 0; 
            padding: 15px; 
            background-color: #f4f4f9; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        h2 { text-align: center; font-size: 1.2rem; margin: 10px 0; }
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #balanceCanvas {
            max-width: 100%;
            background: #fafafa;
            border-radius: 50%;
            border: 2px solid #ddd;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:active { filter: brightness(0.9); }
        #calibrateBtn { background-color: #34c759; display: none; }
        #status { text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <button id="connectBtn">Подключить сенсор</button>
    <button id="calibrateBtn">Начать диагностику (Центровка)</button>
    <div id="status">Отключено</div>

    <!-- Блок стабилометрии (Баланс) -->
    <div class="card">
        <h2>Баланс (Паттерн падения)</h2>
        <canvas id="balanceCanvas" width="250" height="250"></canvas>
    </div>

    <!-- Блок ММТ (График силы) -->
    <div class="card" style="flex: 1.2;">
        <h2>График силы ММТ (FSR)</h2>
        <div class="canvas-container">
            <canvas id="fsrChart"></canvas>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ ЧУВСТВИТЕЛЬНОСТИ И ФИЛЬТРОВ
        // ==========================================
        
        const BALANCE_SENSITIVITY = 15; // Чувствительность отклонения (градусы в пиксели)
        const FSR_MAX_Y = 30; // Максимальная высота графика силы (было 30)

        // НОВЫЕ НАСТРОЙКИ:
        const BALANCE_SMOOTHING = 0.8; // Сглаживание рывков датчика: от 0 (без сглаживания) до 0.95 (очень плавное, как в киселе)
        const TRAIL_LENGTH = 150; // Длина следа (сколько последних точек движения рисовать на экране)

        // ==========================================

        const BLE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const BLE_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let bleDevice, bleServer, bleService, txCharacteristic;
        let dataBuffer = "";

        // Переменные для центровки и сглаживания
        let currentPitch = 0, currentRoll = 0;
        let pitchOffset = 0, rollOffset = 0;
        let smoothPitch = 0, smoothRoll = 0;
        
        // Массив для хранения истории перемещений (СЛЕД)
        let pathHistory = [];

        const canvas = document.getElementById('balanceCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        function drawBalance() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Отрисовка мишени
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for(let r = 30; r <= 120; r += 30) {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.stroke();
            }
            // Осевые линии
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();

            // Отрисовка СЛЕДА (статокинезиограмма)
            if (pathHistory.length > 1) {
                ctx.beginPath();
                ctx.moveTo(pathHistory[0].x, pathHistory[0].y);
                for(let i = 1; i < pathHistory.length; i++) {
                    ctx.lineTo(pathHistory[i].x, pathHistory[i].y);
                }
                ctx.strokeStyle = 'rgba(255, 59, 48, 0.4)'; // Полупрозрачный красный цвет для следа
                ctx.lineWidth = 3;
                ctx.stroke();
            }

            // Отрисовка текущей точки баланса
            if (pathHistory.length > 0) {
                let lastPoint = pathHistory[pathHistory.length - 1];
                ctx.beginPath();
                ctx.arc(lastPoint.x, lastPoint.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff3b30';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        drawBalance(); 

        const ctxChart = document.getElementById('fsrChart').getContext('2d');
        const fsrChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: Array(50).fill(''), 
                datasets: [{
                    label: 'Сила давления',
                    data: Array(50).fill(0),
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 2,
                    pointRadius: 0, 
                    fill: true,
                    tension: 0.2 
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false, 
                scales: {
                    x: { display: false },
                    y: { beginAtZero: true, suggestedMax: FSR_MAX_Y } 
                },
                plugins: { legend: { display: false } }
            }
        });

        function updateFSR(fsrValue) {
            fsrChart.data.datasets[0].data.push(fsrValue);
            fsrChart.data.datasets[0].data.shift(); 
            fsrChart.update('none'); 
        }

        // Кнопка Калибровки
        document.getElementById('calibrateBtn').addEventListener('click', () => {
            pitchOffset = currentPitch;
            rollOffset = currentRoll;
            
            // Сбрасываем сглаженные значения к нулю, чтобы точка прыгнула в центр без задержки
            smoothPitch = 0;
            smoothRoll = 0;

            // Очищаем след
            pathHistory = [];
            
            // Очищаем график FSR
            fsrChart.data.datasets[0].data = Array(50).fill(0);
            fsrChart.update('none');

            document.getElementById('status').innerText = "Центр установлен! Идет запись...";
            document.getElementById('status').style.color = "#ff3b30";
        });

        // Логика Web Bluetooth
        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Поиск устройства...";
                
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }],
                    optionalServices: [BLE_SERVICE_UUID]
                });

                bleDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = "Устройство отключено";
                    document.getElementById('status').style.color = "#666";
                    document.getElementById('connectBtn').style.display = "block";
                    document.getElementById('calibrateBtn').style.display = "none";
                });

                document.getElementById('status').innerText = "Подключение к GATT...";
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
                txCharacteristic = await bleService.getCharacteristic(BLE_TX_UUID);

                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                
                document.getElementById('status').innerText = "Сенсор подключен.";
                document.getElementById('status').style.color = "#34c759";
                
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('calibrateBtn').style.display = "block";
                
            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Ошибка: " + error.message;
            }
        });

        function handleData(event) {
            const decoder = new TextDecoder('utf-8');
            const chunk = decoder.decode(event.target.value);
            dataBuffer += chunk;

            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 

            lines.forEach(line => {
                line = line.trim();
                if(line) {
                    let [fsr, pitch, roll] = line.split(',').map(Number);
                    
                    if(!isNaN(fsr) && !isNaN(pitch) && !isNaN(roll)) {
                        currentPitch = pitch;
                        currentRoll = roll;
                        
                        let relativePitch = currentPitch - pitchOffset;
                        let relativeRoll = currentRoll - rollOffset;

                        // ПРИМЕНЯЕМ ПРОГРАММНЫЙ ФИЛЬТР (Сглаживание)
                        smoothPitch = (smoothPitch * BALANCE_SMOOTHING) + (relativePitch * (1 - BALANCE_SMOOTHING));
                        smoothRoll = (smoothRoll * BALANCE_SMOOTHING) + (relativeRoll * (1 - BALANCE_SMOOTHING));

                        let markerX = cx + (smoothRoll * BALANCE_SENSITIVITY);
                        let markerY = cy - (smoothPitch * BALANCE_SENSITIVITY); 

                        // Ограничение по краям мишени
                        markerX = Math.max(10, Math.min(canvas.width - 10, markerX));
                        markerY = Math.max(10, Math.min(canvas.height - 10, markerY));

                        // ДОБАВЛЯЕМ В ИСТОРИЮ (СЛЕД)
                        pathHistory.push({x: markerX, y: markerY});
                        if(pathHistory.length > TRAIL_LENGTH) {
                            pathHistory.shift(); // Удаляем самую старую точку, если след стал слишком длинным
                        }

                        updateFSR(fsr);
                        drawBalance(); // Отрисовываем след и точку
                    }
                }
            });
        }
    </script>
</body>
</html>
