<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMT & Balance Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { margin: 0; padding: 15px; background-color: #f4f4f9; color: #333; display: flex; flex-direction: column; height: 100vh; }
        h2 { text-align: center; font-size: 1.1rem; margin: 5px 0 10px 0; }
        .card { background: #fff; border-radius: 15px; padding: 15px; margin-bottom: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .canvas-container { width: 100%; height: 100%; position: relative; }
        
        #diagnosticCross { max-width: 100%; background: #ffffff; border-radius: 12px; border: 2px solid #eee; }
        
        button { border: none; padding: 15px; border-radius: 12px; font-size: 1.05rem; font-weight: bold; color: white; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.3s; }
        button:active { filter: brightness(0.8); transform: scale(0.98); }
        button:disabled { background-color: #ccc !important; cursor: not-allowed; }
        
        #connectBtn { background-color: #007aff; }
        .control-panel { display: none; gap: 10px; width: 100%; margin-bottom: 10px; }
        .control-panel button { margin-bottom: 0; flex: 1; padding: 12px; font-size: 0.95rem; }
        
        #calibrateBtn { background-color: #34c759; } 
        #recordBtn { background-color: #ff9500; } 
        #replayBtn { background-color: #af52de; display: none; } 
        
        #status { text-align: center; font-size: 0.95rem; color: #666; margin-bottom: 10px; font-weight: 600; min-height: 22px;}
    </style>
</head>
<body>

    <button id="connectBtn">Подключить сенсор</button>
    
    <div class="control-panel" id="controlPanel">
        <button id="calibrateBtn">Интеллектуальная Калибровка</button>
        <button id="recordBtn">Запись (10с)</button>
    </div>
    <button id="replayBtn">▶ Проиграть запись</button>
    
    <div id="status">Отключено</div>

    <div class="card">
        <h2>Направление падения</h2>
        <canvas id="diagnosticCross" width="250" height="250"></canvas>
    </div>

    <div class="card" style="flex: 1.2;">
        <h2>График силы ММТ (FSR)</h2>
        <div class="canvas-container">
            <canvas id="fsrChart"></canvas>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ КИНЕЗИОЛОГА
        // ==========================================
        const BALANCE_SENSITIVITY = 150; 
        const BALANCE_SMOOTHING = 0.05;  
        const FSR_MAX_Y = 100;        
        const RECORD_TIME_MS = 10000; 
        // ==========================================

        const BLE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const BLE_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let bleDevice, bleServer, bleService, txCharacteristic;
        let dataBuffer = "";

        // Базовые переменные
        let currentFsr = 0, rawPitch = 0, rawRoll = 0;
        let fsrOffset = 0, pitchOffset = 0, rollOffset = 0; 
        let smoothPitch = 0, smoothRoll = 0;
        
        let deadzoneX = 0.2, deadzoneY = 0.2;
        let currentValX = 0, currentValY = 0; 

        // Динамические оси (Определяются автоматически при калибровке)
        let axisY = 'p'; // Какая физическая ось отвечает за Вперед/Назад (p или r)
        let signY = 1;   // Знак направления Вперед
        let axisX = 'r'; // Какая физическая ось отвечает за Вправо/Влево (p или r)
        let signX = 1;   // Знак направления Вправо

        // Переменные режимов
        let isRecording = false, isReplaying = false, recordedSession = [], replayFrame = 0;
        let isCalibrating = false;
        
        // Буферы для калибровки
        let tempP = [], tempR = [];

        const canvas = document.getElementById('diagnosticCross');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        function drawBalance() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#f0f0f0';
            ctx.lineWidth = 12;
            ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(cx, 30); ctx.lineTo(cx, canvas.height - 30); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(30, cy); ctx.lineTo(canvas.width - 30, cy); ctx.stroke();

            ctx.fillStyle = '#999';
            ctx.font = 'bold 11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('ВПЕРЕД', cx, 12);
            ctx.fillText('НАЗАД', cx, canvas.height - 12);
            ctx.fillText('ВЛЕВО', 25, cy - 12);
            ctx.fillText('ВПРАВО', canvas.width - 25, cy - 12);

            let isNeutral = (currentValX === 0 && currentValY === 0);

            if (currentValX !== 0) {
                let targetX = cx + (currentValX * BALANCE_SENSITIVITY);
                targetX = Math.max(30, Math.min(canvas.width - 30, targetX));
                ctx.strokeStyle = '#007aff'; 
                ctx.lineWidth = 12;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(targetX, cy); ctx.stroke();
                ctx.beginPath(); ctx.arc(targetX, cy, 6, 0, 2*Math.PI); 
                ctx.fillStyle = '#007aff'; ctx.fill(); 
            }

            if (currentValY !== 0) {
                let targetY = cy - (currentValY * BALANCE_SENSITIVITY);
                targetY = Math.max(30, Math.min(canvas.height - 30, targetY));
                ctx.strokeStyle = '#ff3b30'; 
                ctx.lineWidth = 12;
                ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, targetY); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx, targetY, 6, 0, 2*Math.PI); 
                ctx.fillStyle = '#ff3b30'; ctx.fill(); 
            }

            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, 2 * Math.PI);
            ctx.fillStyle = isNeutral ? '#34c759' : '#ffffff'; 
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        drawBalance(); 

        const ctxChart = document.getElementById('fsrChart').getContext('2d');
        const fsrChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: Array(50).fill(''), 
                datasets: [{
                    label: 'FSR',
                    data: Array(50).fill(0),
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 2, pointRadius: 0, fill: true, tension: 0.2 
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { x: { display: false }, y: { beginAtZero: true, suggestedMax: FSR_MAX_Y } },
                plugins: { legend: { display: false } }
            }
        });

        function processVisuals(rawF, rawP, rawR) {
            if (isCalibrating) {
                tempP.push(rawP);
                tempR.push(rawR);
                return; // Во время калибровки только копим данные, не рисуем
            }

            let f = Math.max(0, rawF - fsrOffset); 
            let p = rawP - pitchOffset;
            let r = rawR - rollOffset;

            smoothPitch = (smoothPitch * BALANCE_SMOOTHING) + (p * (1 - BALANCE_SMOOTHING));
            smoothRoll = (smoothRoll * BALANCE_SMOOTHING) + (r * (1 - BALANCE_SMOOTHING));

            // ПРИМЕНЯЕМ ДИНАМИЧЕСКИЕ ОСИ, НАЙДЕННЫЕ ПРИ КАЛИБРОВКЕ
            let calcX = (axisX === 'p' ? smoothPitch : smoothRoll) * signX;
            let calcY = (axisY === 'p' ? smoothPitch : smoothRoll) * signY;

            // Мертвая зона
            if (Math.abs(calcX) < deadzoneX) calcX = 0;
            if (Math.abs(calcY) < deadzoneY) calcY = 0;

            // Блокировка движения по диагонали (доминирующая ось)
            if (calcX !== 0 || calcY !== 0) {
                if (Math.abs(calcX) > Math.abs(calcY)) { calcY = 0; } else { calcX = 0; }
            }

            currentValX = calcX;
            currentValY = calcY;

            fsrChart.data.datasets[0].data.push(f);
            fsrChart.data.datasets[0].data.shift(); 
            fsrChart.update('none'); 
            drawBalance();
        }

        // ==========================================
        // МАСТЕР ИНТЕЛЛЕКТУАЛЬНОЙ КАЛИБРОВКИ
        // ==========================================
        function setStatus(msg, color) {
            const status = document.getElementById('status');
            status.innerText = msg;
            status.style.color = color;
        }

        document.getElementById('calibrateBtn').addEventListener('click', async () => {
            if(isRecording || isReplaying || isCalibrating) return;
            
            isCalibrating = true;
            document.getElementById('calibrateBtn').disabled = true;
            document.getElementById('recordBtn').disabled = true;

            // ШАГ 1: ЦЕНТРОВКА
            setStatus("ШАГ 1/3: Стойте ровно...", "#ff9500");
            await new Promise(r => setTimeout(r, 1000)); // Задержка для подготовки
            tempP = []; tempR = []; // Очищаем буфер
            await new Promise(r => setTimeout(r, 2000)); // Собираем данные 2 сек

            let baseP = tempP.reduce((a,b)=>a+b,0)/tempP.length;
            let baseR = tempR.reduce((a,b)=>a+b,0)/tempR.length;
            pitchOffset = baseP; rollOffset = baseR; fsrOffset = currentFsr;

            // Шум
            let maxDevP = Math.max(...tempP.map(v => Math.abs(v - pitchOffset)));
            let maxDevR = Math.max(...tempR.map(v => Math.abs(v - rollOffset)));
            let dzP = Math.min(0.8, Math.max(0.1, maxDevP * 0.6));
            let dzR = Math.min(0.8, Math.max(0.1, maxDevR * 0.6));

            // ШАГ 2: ПОИСК ОСИ ВПЕРЕД
            setStatus("ШАГ 2/3: Наклонитесь ВПЕРЕД и замрите...", "#007aff");
            await new Promise(r => setTimeout(r, 2000)); // Пациент наклоняется
            tempP = []; tempR = [];
            await new Promise(r => setTimeout(r, 2000)); // Собираем наклон

            let fwdP = tempP.reduce((a,b)=>a+b,0)/tempP.length;
            let fwdR = tempR.reduce((a,b)=>a+b,0)/tempR.length;
            let deltaFwdP = fwdP - baseP;
            let deltaFwdR = fwdR - baseR;

            // Какая ось изменилась сильнее - та и есть Y
            if (Math.abs(deltaFwdP) > Math.abs(deltaFwdR)) {
                axisY = 'p'; signY = deltaFwdP > 0 ? 1 : -1;
                axisX = 'r'; deadzoneY = dzP; deadzoneX = dzR;
            } else {
                axisY = 'r'; signY = deltaFwdR > 0 ? 1 : -1;
                axisX = 'p'; deadzoneY = dzR; deadzoneX = dzP;
            }

            // ШАГ 3: ПОИСК ОСИ ВПРАВО
            setStatus("ШАГ 3/3: Наклонитесь ВПРАВО и замрите...", "#007aff");
            await new Promise(r => setTimeout(r, 2000)); // Пациент наклоняется
            tempP = []; tempR = [];
            await new Promise(r => setTimeout(r, 2000)); // Собираем наклон

            let rgtP = tempP.reduce((a,b)=>a+b,0)/tempP.length;
            let rgtR = tempR.reduce((a,b)=>a+b,0)/tempR.length;
            let deltaRgtP = rgtP - baseP;
            let deltaRgtR = rgtR - baseR;

            // Определяем знак для оси X
            if (axisX === 'p') {
                signX = deltaRgtP > 0 ? 1 : -1;
            } else {
                signX = deltaRgtR > 0 ? 1 : -1;
            }

            // ЗАВЕРШЕНИЕ
            isCalibrating = false;
            smoothPitch = 0; smoothRoll = 0; currentValX = 0; currentValY = 0;
            fsrChart.data.datasets[0].data = Array(50).fill(0);
            fsrChart.update('none'); drawBalance();

            setStatus("Калибровка УСПЕШНА! Возвращайтесь в центр.", "#34c759");
            document.getElementById('calibrateBtn').disabled = false;
            document.getElementById('recordBtn').disabled = false;
        });

        document.getElementById('recordBtn').addEventListener('click', () => {
            if(isReplaying || isCalibrating) return;
            isRecording = true; recordedSession = []; currentValX = 0; currentValY = 0;
            fsrChart.data.datasets[0].data = Array(50).fill(0); 
            setStatus("ИДЕТ ЗАПИСЬ ПАДЕНИЯ (10 сек)...", "#ff3b30");
            document.getElementById('calibrateBtn').disabled = true;
            document.getElementById('recordBtn').disabled = true;
            document.getElementById('replayBtn').style.display = "none";
            
            setTimeout(() => {
                isRecording = false;
                setStatus("Запись завершена!", "#34c759");
                document.getElementById('calibrateBtn').disabled = false;
                document.getElementById('recordBtn').disabled = false;
                if (recordedSession.length > 0) document.getElementById('replayBtn').style.display = "block"; 
            }, RECORD_TIME_MS);
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            if(isRecording || recordedSession.length === 0 || isCalibrating) return;
            isReplaying = true; replayFrame = 0; smoothPitch = 0; smoothRoll = 0; currentValX = 0; currentValY = 0;
            fsrChart.data.datasets[0].data = Array(50).fill(0);
            setStatus("ПРОИГРЫВАНИЕ ЗАПИСИ...", "#af52de");
            replayStep(); 
        });

        function replayStep() {
            if (!isReplaying) return;
            if (replayFrame >= recordedSession.length) {
                isReplaying = false;
                setStatus("Просмотр окончен. Готов к новому тесту.", "#666");
                return;
            }
            let frame = recordedSession[replayFrame];
            processVisuals(frame.f, frame.p, frame.r);
            replayFrame++;
            setTimeout(replayStep, 30); 
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                setStatus("Поиск устройства...", "#666");
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }], optionalServices: [BLE_SERVICE_UUID]
                });
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    setStatus("Отключено", "#666");
                    document.getElementById('connectBtn').style.display = "block";
                    document.getElementById('controlPanel').style.display = "none";
                    document.getElementById('replayBtn').style.display = "none";
                    isRecording = false; isReplaying = false; isCalibrating = false;
                });
                setStatus("Подключение...", "#666");
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
                txCharacteristic = await bleService.getCharacteristic(BLE_TX_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                
                setStatus("Сенсор подключен.", "#34c759");
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('controlPanel').style.display = "flex";
            } catch (error) {
                console.error(error); setStatus("Ошибка: " + error.message, "#ff3b30");
            }
        });

        function handleData(event) {
            const decoder = new TextDecoder('utf-8');
            dataBuffer += decoder.decode(event.target.value);
            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 
            lines.forEach(line => {
                line = line.trim();
                if(line) {
                    let [fsr, pitch, roll] = line.split(',').map(Number);
                    if(!isNaN(fsr) && !isNaN(pitch) && !isNaN(roll)) {
                        currentFsr = fsr; rawPitch = pitch; rawRoll = roll;
                        if (isRecording && !isCalibrating) recordedSession.push({ f: fsr, p: pitch, r: roll });
                        if (!isReplaying) processVisuals(fsr, pitch, roll);
                    }
                }
            });
        }
    </script>
</body>
</html>
