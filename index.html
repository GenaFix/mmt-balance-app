<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MMT & Balance Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { 
            margin: 0; 
            padding: 15px; 
            background-color: #f4f4f9; 
            color: #333; 
            display: flex; 
            flex-direction: column; 
            height: 100vh;
        }
        h2 { text-align: center; font-size: 1.1rem; margin: 5px 0 10px 0; }
        .card {
            background: #fff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .canvas-container { width: 100%; height: 100%; position: relative; }
        
        #balanceCanvas {
            max-width: 100%;
            background: #fafafa;
            border-radius: 10px; 
            border: 2px solid #ddd;
        }
        
        button {
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:active { filter: brightness(0.8); }
        
        #connectBtn { background-color: #007aff; }
        
        .control-panel { display: none; gap: 10px; width: 100%; margin-bottom: 10px; }
        .control-panel button { margin-bottom: 0; flex: 1; padding: 12px; font-size: 0.95rem; }
        
        #calibrateBtn { background-color: #34c759; } 
        #recordBtn { background-color: #ff9500; } 
        #replayBtn { background-color: #af52de; display: none; } 
        
        #status { text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 10px; font-weight: 500; }
    </style>
</head>
<body>

    <button id="connectBtn">Подключить сенсор</button>
    
    <div class="control-panel" id="controlPanel">
        <button id="calibrateBtn">Центровка</button>
        <button id="recordBtn">Запись (10с)</button>
    </div>
    <button id="replayBtn">▶ Проиграть запись</button>
    
    <div id="status">Отключено</div>

    <div class="card">
        <h2>Баланс (Паттерн падения)</h2>
        <canvas id="balanceCanvas" width="250" height="250"></canvas>
    </div>

    <div class="card" style="flex: 1.2;">
        <h2>График силы ММТ (FSR)</h2>
        <div class="canvas-container">
            <canvas id="fsrChart"></canvas>
        </div>
    </div>

    <script>
        // ==========================================
        // НАСТРОЙКИ
        // ==========================================
        const BALANCE_SENSITIVITY = 35; 
        const INVERT_X = false;  
        const INVERT_Y = false;  
        const FSR_MAX_Y = 100;        
        const BALANCE_SMOOTHING = 0.8; 
        const TRAIL_LENGTH = 300;     
        const RECORD_TIME_MS = 10000; 
        // ==========================================

        const BLE_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const BLE_TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
        let bleDevice, bleServer, bleService, txCharacteristic;
        let dataBuffer = "";

        let currentFsr = 0, currentPitch = 0, currentRoll = 0;
        let fsrOffset = 0, pitchOffset = 0, rollOffset = 0; 
        let smoothPitch = 0, smoothRoll = 0;
        let pathHistory = [];
        let isRecording = false, isReplaying = false, recordedSession = [], replayFrame = 0;

        const canvas = document.getElementById('balanceCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        function drawBalance() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // НОВАЯ КВАДРАТНАЯ СЕТКА МИШЕНИ
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for(let r = 30; r <= 120; r += 30) {
                ctx.strokeRect(cx - r, cy - r, r * 2, r * 2);
            }
            
            // Перекрестие
            ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy); ctx.stroke();

            // Отрисовка следа
            if (pathHistory.length > 1) {
                ctx.beginPath();
                ctx.moveTo(pathHistory[0].x, pathHistory[0].y);
                for(let i = 1; i < pathHistory.length; i++) {
                    ctx.lineTo(pathHistory[i].x, pathHistory[i].y);
                }
                ctx.strokeStyle = '#007aff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // Отрисовка точки
            if (pathHistory.length > 0) {
                let lastPoint = pathHistory[pathHistory.length - 1];
                ctx.beginPath();
                ctx.arc(lastPoint.x, lastPoint.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = '#ff3b30';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }
        drawBalance(); 

        const ctxChart = document.getElementById('fsrChart').getContext('2d');
        const fsrChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: Array(50).fill(''), 
                datasets: [{
                    label: 'FSR',
                    data: Array(50).fill(0),
                    borderColor: '#007aff',
                    backgroundColor: 'rgba(0, 122, 255, 0.1)',
                    borderWidth: 2, pointRadius: 0, fill: true, tension: 0.2 
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false, animation: false, 
                scales: { x: { display: false }, y: { beginAtZero: true, suggestedMax: FSR_MAX_Y } },
                plugins: { legend: { display: false } }
            }
        });

        function processVisuals(rawFsr, rawPitch, rawRoll) {
            let f = Math.max(0, rawFsr - fsrOffset); 
            let p = rawPitch - pitchOffset;
            let r = rawRoll - rollOffset;

            smoothPitch = (smoothPitch * BALANCE_SMOOTHING) + (p * (1 - BALANCE_SMOOTHING));
            smoothRoll = (smoothRoll * BALANCE_SMOOTHING) + (r * (1 - BALANCE_SMOOTHING));

            let dirX = INVERT_X ? -1 : 1;
            let dirY = INVERT_Y ? -1 : 1;

            let markerX = cx + (smoothPitch * BALANCE_SENSITIVITY * dirX);
            let markerY = cy - (smoothRoll * BALANCE_SENSITIVITY * dirY); 

            // ТОЧНОЕ ограничение по внешнему квадрату (отступ 5 пикселей от краев)
            markerX = Math.max(5, Math.min(245, markerX));
            markerY = Math.max(5, Math.min(245, markerY));

            pathHistory.push({x: markerX, y: markerY});
            if(pathHistory.length > TRAIL_LENGTH) pathHistory.shift();

            fsrChart.data.datasets[0].data.push(f);
            fsrChart.data.datasets[0].data.shift(); 
            fsrChart.update('none'); 

            drawBalance();
        }

        document.getElementById('calibrateBtn').addEventListener('click', () => {
            if(isRecording || isReplaying) return;
            pitchOffset = currentPitch; rollOffset = currentRoll; fsrOffset = currentFsr; 
            smoothPitch = 0; smoothRoll = 0; pathHistory = [];
            fsrChart.data.datasets[0].data = Array(50).fill(0);
            fsrChart.update('none'); drawBalance();
            document.getElementById('status').innerText = "Откалибровано. Ноль установлен.";
            document.getElementById('status').style.color = "#34c759";
        });

        document.getElementById('recordBtn').addEventListener('click', () => {
            if(isReplaying) return;
            isRecording = true; recordedSession = []; pathHistory = []; 
            fsrChart.data.datasets[0].data = Array(50).fill(0); 
            document.getElementById('status').innerText = "ИДЕТ ЗАПИСЬ (10 сек)...";
            document.getElementById('status').style.color = "#ff3b30";
            document.getElementById('recordBtn').disabled = true;
            document.getElementById('replayBtn').style.display = "none";
            setTimeout(() => {
                isRecording = false;
                document.getElementById('status').innerText = "Запись завершена!";
                document.getElementById('status').style.color = "#34c759";
                document.getElementById('recordBtn').disabled = false;
                if (recordedSession.length > 0) document.getElementById('replayBtn').style.display = "block"; 
            }, RECORD_TIME_MS);
        });

        document.getElementById('replayBtn').addEventListener('click', () => {
            if(isRecording || recordedSession.length === 0) return;
            isReplaying = true; replayFrame = 0; pathHistory = []; smoothPitch = 0; smoothRoll = 0;
            fsrChart.data.datasets[0].data = Array(50).fill(0);
            document.getElementById('status').innerText = "ПРОИГРЫВАНИЕ ЗАПИСИ...";
            document.getElementById('status').style.color = "#af52de";
            replayStep(); 
        });

        function replayStep() {
            if (!isReplaying) return;
            if (replayFrame >= recordedSession.length) {
                isReplaying = false;
                document.getElementById('status').innerText = "Просмотр окончен. Ожидание...";
                document.getElementById('status').style.color = "#666";
                return;
            }
            let frame = recordedSession[replayFrame];
            processVisuals(frame.f, frame.p, frame.r);
            replayFrame++;
            setTimeout(replayStep, 30); 
        }

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                document.getElementById('status').innerText = "Поиск устройства...";
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'Holyiot' }], optionalServices: [BLE_SERVICE_UUID]
                });
                bleDevice.addEventListener('gattserverdisconnected', () => {
                    document.getElementById('status').innerText = "Отключено";
                    document.getElementById('connectBtn').style.display = "block";
                    document.getElementById('controlPanel').style.display = "none";
                    document.getElementById('replayBtn').style.display = "none";
                    isRecording = false; isReplaying = false;
                });
                document.getElementById('status').innerText = "Подключение...";
                bleServer = await bleDevice.gatt.connect();
                bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
                txCharacteristic = await bleService.getCharacteristic(BLE_TX_UUID);
                await txCharacteristic.startNotifications();
                txCharacteristic.addEventListener('characteristicvaluechanged', handleData);
                document.getElementById('status').innerText = "Сенсор подключен.";
                document.getElementById('status').style.color = "#34c759";
                document.getElementById('connectBtn').style.display = "none";
                document.getElementById('controlPanel').style.display = "flex";
            } catch (error) {
                console.error(error); document.getElementById('status').innerText = "Ошибка: " + error.message;
            }
        });

        function handleData(event) {
            const decoder = new TextDecoder('utf-8');
            dataBuffer += decoder.decode(event.target.value);
            let lines = dataBuffer.split('\n');
            dataBuffer = lines.pop(); 
            lines.forEach(line => {
                line = line.trim();
                if(line) {
                    let [fsr, pitch, roll] = line.split(',').map(Number);
                    if(!isNaN(fsr) && !isNaN(pitch) && !isNaN(roll)) {
                        currentFsr = fsr; currentPitch = pitch; currentRoll = roll;
                        if (isRecording) recordedSession.push({ f: fsr, p: pitch, r: roll });
                        if (!isReplaying) processVisuals(fsr, pitch, roll);
                    }
                }
            });
        }
    </script>
</body>
</html>
